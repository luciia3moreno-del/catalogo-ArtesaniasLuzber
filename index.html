    .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .sinfoto { color: #8a7b68; font-size: 0.9rem; font-style: italic; }
    figcaption { padding: 0.75rem 1rem 1rem; }
    figcaption h3 { margin: 0 0 0.25rem; font-size: 1.02rem; font-weight: 600; }
    figcaption .precio { margin: 0; font-size: 1rem; color: #7a4e2d; font-weight: 600; }
    figcaption .nota { margin: 0.25rem 0 0; font-size: 0.82rem; color: #6b5e50; }

    .pegajoso .barra { padding-bottom: 0.5rem; }
    .contacto a { text-decoration: underline; }
    .barra-filtro select { padding: 0.5rem 1rem; border: 1px solid #d6c9b6; border-radius: 999px; font-size: 0.95rem; background: #fff; color: #2b2622; }
    .contacto { display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .contacto a { display: inline-flex; align-items: center; gap: 0.4rem; color: #632B50; text-decoration: underline; font-size: 0.95rem; }
    .contacto a:hover { text-decoration: underline; }
    .contacto svg { width: 20px; height: 20px; }
    .oculto { display: none; }
    .entrega { margin: 0.4rem 0 0; display: inline-block; font-size: 0.78rem; font-weight: 600; color: #2f6b3e; background: #e6f2e8; padding: 2px 8px; border-radius: 999px; }
    .dto-precio { margin: 0.1rem 0 0; font-size: 0.85rem; font-weight: 600; color: #a33; }
    .cats-cliente { margin: 0.2rem 0 0; font-size: 0.78rem; color: #7a4e2d; }

    .visor.abierto { display: flex; }

    .visor-pie { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .visor-pie h2 { margin: 0; font-size: 1.05rem; font-weight: 600; text-align: center; }
    .visor-contador { color: #6b5e50; font-size: 0.85rem; }
    .visor-pie button { background: #fff; border: 1px solid #d6c9b6; border-radius: 999px; padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.9rem; }
    .visor-pie button:hover { background: #f2ebdf; }
    .visor-pie button.oculto { visibility: hidden; }
    .visor-cerrar { position: absolute; top: 0.25rem; right: 0.6rem; background: none; border: none; font-size: 2rem; line-height: 1; cursor: pointer; color: #2b2622; }
    .visor-miniaturas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }

  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Vista ampliada">
    <div class="visor-caja">
      <button class="visor-cerrar" id="visor-cerrar" aria-label="Cerrar">×</button>
      <img class="visor-img" id="visor-img" alt="">
      <div class="visor-pie">
        <button id="visor-prev" aria-label="Foto anterior">‹ Anterior</button>
        <div><h2 id="visor-titulo"></h2><span class="visor-contador" id="visor-contador"></span></div>
        <button id="visor-next" aria-label="Foto siguiente">Siguiente ›</button>
      </div>
      <div class="visor-miniaturas" id="visor-miniaturas"></div>
      
    </div>
  </div>
  <script>
    const buscar = document.getElementById('buscar');
    const tarjetas = Array.from(document.querySelectorAll('.card'));
    const contador = document.getElementById('contador');
    function filtrar() {
      const q = buscar.value.trim().toLowerCase();
      let visibles = 0;
      for (const t of tarjetas) {
        const catSel = document.getElementById('categoria').value;
        const coincide = t.dataset.buscar.includes(q) && (!catSel || (t.dataset.cat || '').split('|').includes(catSel));
        t.classList.toggle('oculto', !coincide);
        if (coincide) visibles++;
      }
      contador.textContent = visibles + ' de ' + tarjetas.length + ' productos';
    }
    buscar.addEventListener('input', filtrar);
    document.getElementById('categoria').addEventListener('change', filtrar);
    filtrar();

    // Orden alfabético por nombre
    (function () {
      const main = document.getElementById('catalogo');
      const cards = [...main.querySelectorAll('.card')];
      cards.sort((a, b) => a.querySelector('h3').textContent.localeCompare(b.querySelector('h3').textContent, 'es', { sensitivity: 'base' }));
      cards.forEach(c => main.appendChild(c));
    })();

    const visor = document.getElementById('visor');
    const visorImg = document.getElementById('visor-img');
    const visorTitulo = document.getElementById('visor-titulo');
    const visorContador = document.getElementById('visor-contador');
    const visorMini = document.getElementById('visor-miniaturas');
    const btnPrev = document.getElementById('visor-prev');
    const btnNext = document.getElementById('visor-next');
    let galeria = [];
    let actual = 0;

    function mostrarFoto(i) {
      actual = (i + galeria.length) % galeria.length;
      visorImg.src = galeria[actual];
      visorContador.textContent = (actual + 1) + ' / ' + galeria.length;
      visorMini.querySelectorAll('img').forEach((m, k) => m.classList.toggle('activa', k === actual));
      const varias = galeria.length > 1;
      btnPrev.classList.toggle('oculto', !varias);
      btnNext.classList.toggle('oculto', !varias);
    }

    function abrirVisor(tarjeta) {
      galeria = Array.from(tarjeta.querySelectorAll('.galeria img')).map(img => img.getAttribute('src'));
      if (galeria.length === 0) return;
      visorTitulo.textContent = tarjeta.querySelector('h3').textContent;
      visorMini.innerHTML = '';
      galeria.forEach((src, k) => {
        const m = document.createElement('img');
        m.src = src;
        m.alt = '';
        m.addEventListener('click', () => mostrarFoto(k));
        visorMini.appendChild(m);
      });
      mostrarFoto(0);
      visor.classList.add('abierto');
    }

    function cerrarVisor() {
      visor.classList.remove('abierto');
      visorImg.removeAttribute('src');
    }

    tarjetas.forEach(t => {
      if (t.classList.contains('con-fotos')) t.addEventListener('click', () => abrirVisor(t));
    });
    btnPrev.addEventListener('click', e => { e.stopPropagation(); mostrarFoto(actual - 1); });
    btnNext.addEventListener('click', e => { e.stopPropagation(); mostrarFoto(actual + 1); });
    document.getElementById('visor-cerrar').addEventListener('click', cerrarVisor);
    visor.addEventListener('click', e => { if (e.target === visor) cerrarVisor(); });
    document.addEventListener('keydown', e => {
      if (!visor.classList.contains('abierto')) return;
      if (e.key === 'Escape') cerrarVisor();
      if (e.key === 'ArrowLeft') mostrarFoto(actual - 1);
      if (e.key === 'ArrowRight') mostrarFoto(actual + 1);
    });
  </script>
